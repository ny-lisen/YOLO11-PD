# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 380 layers,  1737504 parameters,  3157184 gradients,   5.2 GFLOPs

fusion_mode: 'bifpn'
head_channel: 256

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f_WTConv, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_WTConv, [1024, True]]
  - [-1, 1, SCSP, [1024]]  # 9

# YOLOv8.0n head
head:
#  Unified channel number
  - [4, 1, Conv, [head_channel]]  # 10-P3/8
  - [6, 1, Conv, [head_channel]]  # 11-P4/16
  - [9, 1, Conv, [head_channel]]  # 12-P5/32

# The Rising stage of the Feature Pyramid
  - [11, 1, Conv, [head_channel, 3, 2]] # 13-P5/32
  - [[-1, 12], 1, Fusion, [fusion_mode]] # 14
  - [-1, 6, CSP_MSCB, [head_channel, [5,7,9]]] # 15-P5/32

  - [-1, 1, EUCB, []] # 16-P4/16
  - [10, 1, Conv, [head_channel, 3, 2]] # 17-P4/16
  - [[-1, -2, 11], 1, Fusion, [fusion_mode]] # 18
  - [-1, 6, CSP_MSCB, [head_channel, [3,5,7]]] # 19-P4/16

  - [-1, 1, EUCB, []] # 20-P3/8
  - [2, 1, Conv, [head_channel, 3, 2]] # 21-P3/8
  - [[-1, -2, 10], 1, Fusion, [fusion_mode]] # 22
  - [-1, 6, CSP_MSCB, [head_channel, [1,3,5]]] # 23-P3/8

# The Descending stage of the Feature Pyramid
  - [[20, -1], 1, Fusion, [fusion_mode]] # 24
  - [-1, 3, CSP_MSCB, [head_channel, [1,3,5]]] # 25-P3/8

  - [23, 1, Conv, [head_channel, 3, 2]] # 26-P4/16
  - [25, 1, Conv, [head_channel, 3, 2]] # 27-P4/16
  - [[-1, -2, 19, 16], 1, Fusion, [fusion_mode]] # 28-P4/16
  - [-1, 3, CSP_MSCB, [head_channel, [3,5,7]]] # 29-P4/16

  - [19, 1, Conv, [head_channel, 3, 2]] # 30-P5/32
  - [29, 1, Conv, [head_channel, 3, 2]] # 31-P5/32
  - [[-1, -2, 15], 1, Fusion, [fusion_mode]] # 32-P5/32
  - [-1, 3, CSP_MSCB, [head_channel, [5,7,9]]] # 33-P5/32

  - [[25, 29, 33], 1, DRDetect, [nc, 256]] # Detect(P3, P4, P5)